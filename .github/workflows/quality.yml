name: PulseFlow quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulseflow-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Carregar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar dependências Python
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validar Python
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Validar JavaScript e regras comerciais
        run: |
          node --check app.js
          node --check core.mjs
          node --test tests/core.test.mjs
      - name: Validar contratos HTTP isolados
        run: |
          python3 tests/serve_test.py --test-only > /tmp/pulseflow-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8788/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          node --test tests/contracts.test.cjs
      - name: Instalar navegador do teste de webhooks
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Validar interface segura de webhooks
        run: |
          python3 tests/serve_test.py --test-only > /tmp/pulseflow-webhook-ui-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8788/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          CI=1 node --test tests/webhook_ui.test.cjs
